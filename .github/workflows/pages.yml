# Browser-only demo on GitHub Pages: copies public/ to the gh-pages branch on every change.
# There is no server there, so the site and admin run on sample data kept in the visitor's browser.
name: Demo on GitHub Pages
on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push public/ to gh-pages
        run: |
          cp -r public /tmp/site && touch /tmp/site/.nojekyll
          # stamp our own files with this commit, so phones never keep an old copy
          sed -i -E "s/\?v=[0-9a-z]+\"/?v=${GITHUB_SHA::7}\"/g" /tmp/site/*.html
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Demo from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
